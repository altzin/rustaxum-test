services:
  postgres:
    image: docker.io/postgres:16-alpine
    container_name: fault-postgres
    environment:
      POSTGRES_USER: {POSTGRES_USER}
      POSTGRES_PASSWORD: {POSTGRES_PASSWORD}
      POSTGRES_DB: {DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    env_file: ../../checkpoint-kenny/.env
    #domain owner keeps this env
volumes:
  pgdata:
